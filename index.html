<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">
    <title>Typing Sprint</title>
</head>

<body>
    <div class="wrapper">
        <div class="topbar">
            <div>
                <h1>Typing Sprint</h1>
                <span id="statusText" class="status" data-tone="neutral">Ready to type</span>
            </div>
        </div>

        <input type="text" class="input-field" aria-label="Typing input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="content-box">
            <div class="typing-text">
                <p></p>
            </div>
            <div class="content">
                <ul class="result-details">
                    <li class="time">
                        <p>Time left:</p>
                        <span><b>60</b>s</span>
                    </li>
                    <li class="mistake">
                        <p>Mistake:</p>
                        <span>0</span>
                    </li>
                    <li class="wpm">
                        <p>WPM:</p>
                        <span>0</span>
                    </li>
                    <li class="cpm">
                        <p>CPM:</p>
                        <span>0</span>
                    </li>
                    <li class="accuracy">
                        <p>Accuracy:</p>
                        <span>100%</span>
                    </li>
                </ul>
                <div class="button-group">
                    <button id="newParagraphBtn" class="secondary">Next Level</button>
                    <button id="resetBtn">Restart</button>
                </div>
            </div>
            <div class="best-score">
                <span>Best score</span>
                <strong id="bestScore">0</strong>
                <span>WPM</span>
            </div>
        </div>
    </div>

    <script src="js/paragraphs.js"></script>
    <script src="js/scripts.js"></script>
</body>

</html>
